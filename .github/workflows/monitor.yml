name: Binance Square View Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: binance-square-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run view monitor
        run: |
          node bot/monitor-views.mjs

      - name: Save stats
        if: always()
        run: |
          git config user.name "binance-square-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/post-stats.json

          if git diff --cached --quiet; then
            echo "No stats changes."
            exit 0
          fi

          git commit -m "Update post view stats"

          # This workflow and the publish workflow can commit
          # around the same time — rebase onto the latest remote
          # state before pushing rather than fail outright.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi

            echo "Push rejected, pulling and retrying ($attempt/3)..."
            git pull --rebase origin main
          done

          echo "Could not push after 3 attempts — leaving for next run."
