name: Binance Square Auto Post

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: binance-square-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install chart renderer
        run: |
          npm install sharp

      - name: Install Binance Square Skill
        run: |
          npx skills add binance/binance-skills-hub --skill square-post --agent '*' -y

      - name: Run Binance Square Bot
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          node bot/index.mjs

      - name: Save bot history
        run: |
          git config user.name "binance-square-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/history.json

          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Update bot publishing history"
            git push
          fi
