name: Binance Square Auto Post

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: binance-square-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: |
          npm install sharp

      - name: Install Binance Square Skill
        run: |
          npx skills add binance/binance-skills-hub \
            --skill square-post \
            --agent '*' \
            -y

      - name: Run Binance Square Bot
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          node bot/index.mjs

      - name: Save history
        if: always()
        run: |
          git config user.name "binance-square-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/history.json data/health.json

          if git diff --cached --quiet; then
            echo "No history changes."
          else
            git commit -m "Update publishing history"
            git push
          fi
